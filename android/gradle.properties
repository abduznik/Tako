org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows-only workaround: the Kotlin build-tools-api incremental compiler
# intermittently fails to close its cache files here ("Could not close
# incremental caches ... class-fq-name-to-source.tab"), likely due to
# antivirus file-lock contention. Disabling incremental compilation trades
# a slower rebuild for a reliable one.
kotlin.incremental=false
