name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            build-cmd: flutter build windows --release
            artifact-path: build/windows/x64/runner/Release
            archive-cmd: 7z a ../../../../tako-windows.zip ./*
            archive-file: tako-windows.zip
          - os: macos-latest
            target: macos
            build-cmd: flutter build macos --release
            artifact-path: build/macos/Build/Products/Release
            archive-cmd: zip -r ../../../../../tako-macos.zip .
            archive-file: tako-macos.zip
          - os: ubuntu-latest
            target: linux
            build-cmd: flutter build linux --release
            artifact-path: build/linux/x64/release/bundle
            archive-cmd: zip -r ../../../../../tako-linux.zip .
            archive-file: tako-linux.zip
          - os: ubuntu-latest
            target: web
            build-cmd: flutter build web --release
            artifact-path: build/web
            archive-cmd: zip -r ../../../tako-web.zip .
            archive-file: tako-web.zip
          - os: ubuntu-latest
            target: android
            build-cmd: flutter build apk --release
            artifact-path: build/app/outputs/flutter-apk
            archive-cmd: cp app-release.apk ../../../../../tako-android.apk
            archive-file: tako-android.apk
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: ${{ matrix.build-cmd }}
      - name: Package
        working-directory: ${{ matrix.artifact-path }}
        run: ${{ matrix.archive-cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive-file }}
          path: ${{ matrix.archive-file }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
